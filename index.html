<!DOCTYPE html>
<html>

<head>

    <title>My Cloud Website</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Dark Mode Toggle -->

    <button id="theme-toggle">🌙</button>

    <!-- Logo -->

    <div class="logo-container">
        <img src="logo.png" class="logo">
    </div>

    <!-- Navigation -->

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Hero Section -->

    <div class="hero">

        <div class="card">

            <h1>Welcome to My Cloud Website</h1>

            <p class="subtitle">
                Premium Cloud Computing Project
            </p>

            <p>
                Hosted professionally using GitHub Pages cloud platform.
            </p>

            <div class="buttons">
                <a href="about.html" class="btn">Explore More</a>

                <a href="contact.html" class="btn btn-secondary">
                    Contact Me
                </a>
            </div>

            <!-- Social Icons -->

            <div class="social-icons">

                <a href="#">
                    <i class="fab fa-facebook"></i>
                </a>

                <a href="#">
                    <i class="fab fa-instagram"></i>
                </a>

                <a href="#">
                    <i class="fab fa-github"></i>
                </a>

                <a href="#">
                    <i class="fab fa-linkedin"></i>
                </a>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer>
        © 2026 Roman Dahal | Cloud Computing Assignment
    </footer>

    <script>

        const toggle = document.getElementById("theme-toggle");

        toggle.addEventListener("click", () => {
            document.body.classList.toggle("light-mode");
        });

    </script>

</body>

</html>
